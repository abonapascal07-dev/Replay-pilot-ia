<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReplyPilot AI | Live Customer Chat</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eef2fa;color:#18233c}
.chatbox{max-width:650px;height:100dvh;margin:auto;background:white;display:flex;flex-direction:column;box-shadow:0 0 30px #17234b18}
header{background:#101a35;color:white;padding:20px}
header h2{margin:0 0 6px;font-size:22px}
header p{margin:0;color:#c7d3f5;font-size:13px}
.messages{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.bubble{padding:13px 16px;border-radius:16px;max-width:88%;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.bot{align-self:flex-start;background:#edf1fa}
.user{align-self:flex-end;background:#4568f5;color:white}
form{display:flex;gap:8px;padding:14px;border-top:1px solid #e6e9f2}
input{flex:1;min-width:0;padding:14px;border:1px solid #d9dfec;border-radius:12px;font-size:15px}
button{background:#4568f5;color:white;border:0;border-radius:12px;padding:0 18px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
.notice{font-size:12px;color:#66728c;text-align:center;padding:0 15px 12px}
</style>
</head>
<body>
<div class="chatbox">
<header>
<h2>💬 ReplyPilot AI</h2>
<p>Customer Support Assistant</p>
</header>

<div class="messages" id="messages">
<div class="bubble bot">Hello! 👋 Welcome to our customer support chat. How can I help you today?</div>
</div>

<form id="chatForm">
<input id="customerMessage" placeholder="Type your message..." autocomplete="off" maxlength="2000" required>
<button id="sendButton" type="submit">Send</button>
</form>

<div class="notice" id="notice">AI assistant • Please don't share passwords or payment details.</div>
</div>

<script>
const messages=document.getElementById("messages");
const form=document.getElementById("chatForm");
const input=document.getElementById("customerMessage");
const sendButton=document.getElementById("sendButton");
const notice=document.getElementById("notice");

let history=[];

function addMessage(text,role){
const bubble=document.createElement("div");
bubble.className="bubble "+role;
bubble.textContent=text;
messages.appendChild(bubble);
messages.scrollTop=messages.scrollHeight;
}

form.addEventListener("submit",async(event)=>{
event.preventDefault();
const text=input.value.trim();
if(!text)return;

addMessage(text,"user");
input.value="";
sendButton.disabled=true;
notice.textContent="ReplyPilot is typing...";

try{
const response=await fetch("/api/public-chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
message:text,
history:history
})
});

const data=await response.json();

if(!response.ok){
throw new Error(data.error||"Unable to generate a reply.");
}

if(!data.reply){
throw new Error("No reply received.");
}

addMessage(data.reply,"bot");

history.push(
{role:"user",content:text},
{role:"assistant",content:data.reply}
);

if(history.length>20){
history=history.slice(-20);
}

notice.textContent="AI assistant • Replies may need verification.";

}catch(error){
addMessage("Sorry, I can't respond right now. Please try again later.","bot");
notice.textContent=error.message;
}finally{
sendButton.disabled=false;
input.focus();
}
});
</script>
</body>
</html>
