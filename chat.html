

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReplyPilot AI | Secure Chat</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #eef2fa; color: #18233c; }
    .chatbox { max-width: 650px; height: 100dvh; margin: auto; background: white; display: flex; flex-direction: column; }
    header { background: #101a35; color: white; padding: 20px; }
    header h2 { margin: 0 0 6px; font-size: 22px; }
    header p { margin: 0; color: #c7d3f5; font-size: 13px; }
    .messages { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
    .bubble { padding: 13px 16px; border-radius: 16px; max-width: 88%; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
    .bot { align-self: flex-start; background: #edf1fa; }
    .user { align-self: flex-end; background: #4568f5; color: white; }
    form { display: flex; gap: 8px; padding: 14px; border-top: 1px solid #e6e9f2; }
    input { flex: 1; min-width: 0; padding: 14px; border: 1px solid #d9dfe9; border-radius: 12px; font-size: 15px; }
    button { background: #4568f5; color: white; border: 0; border-radius: 12px; padding: 0 18px; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: .6; }
    .notice { color: #66728c; text-align: center; padding: 0 15px 12px; font-size: 12px; }
    .login { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .login input { width: 100%; }
    .login button { padding: 14px; }
    .hidden { display: none !important; }
    .signout { background: transparent; border: 1px solid #c7d3f5; padding: 7px 10px; font-size: 12px; float: right; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="chatbox">
  <header>
    <button class="signout hidden" id="signOut">Sign out</button>
    <h2>💬 ReplyPilot AI</h2>
    <p>Secure Customer Support Assistant</p>
  </header>

  <section class="login" id="loginSection">
    <h3>Sign in to continue</h3>
    <input id="email" type="email" placeholder="Email address" autocomplete="email">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button id="loginButton">Sign in</button>
    <p>Don't have an account? <a href="/">Create one here</a>.</p>
    <p id="loginStatus"></p>
  </section>

  <div class="messages hidden" id="messages">
    <div class="bubble bot">Hello! 👋 Welcome to ReplyPilot AI. How can I help you today?</div>
  </div>

  <form id="chatForm" class="hidden">
    <input id="customerMessage" placeholder="Type your message..." maxlength="2000" required>
    <button id="sendButton" type="submit">Send</button>
  </form>
  <div class="notice" id="notice">Sign in to use the AI assistant.</div>
</div>

<script>
const SUPABASE_URL = "https://zsrkyikjyrfxbdkipnhu.supabase.co";
const SUPABASE_PUBLIC_KEY = "PASTE_YOUR_EXISTING_SUPABASE_PUBLISHABLE_KEY_HERE";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLIC_KEY
);

const messages = document.getElementById("messages");
const form = document.getElementById("chatForm");
const input = document.getElementById("customerMessage");
const sendButton = document.getElementById("sendButton");
const notice = document.getElementById("notice");
const loginSection = document.getElementById("loginSection");
const loginStatus = document.getElementById("loginStatus");
const signOut = document.getElementById("signOut");
let history = [];

function showChat(signedIn) {
  loginSection.classList.toggle("hidden", signedIn);
  messages.classList.toggle("hidden", !signedIn);
  form.classList.toggle("hidden", !signedIn);
  signOut.classList.toggle("hidden", !signedIn);
  notice.textContent = signedIn
    ? "AI assistant · Replies may need verification."
    : "Sign in to use the AI assistant.";
  if (!signedIn) history = [];
}

function addMessage(text, role) {
  const bubble = document.createElement("div");
  bubble.className = "bubble " + role;
  bubble.textContent = text;
  messages.appendChild(bubble);
  messages.scrollTop = messages.scrollHeight;
}

document.getElementById("loginButton").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  loginStatus.textContent = "Signing in...";
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  loginStatus.textContent = error ? error.message : "";
});

signOut.addEventListener("click", async () => {
  await supabaseClient.auth.signOut();
  window.location.reload();
});

supabaseClient.auth.onAuthStateChange((_event, session) => {
  showChat(!!session);
});

supabaseClient.auth.getSession().then(({ data }) => {
  showChat(!!data.session);
});

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const text = input.value.trim();
  if (!text) return;

  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) {
    showChat(false);
    return;
  }

  addMessage(text, "user");
  input.value = "";
  sendButton.disabled = true;
  notice.textContent = "ReplyPilot is typing...";

  try {
    const nextHistory = [
      ...history,
      { role: "user", parts: [{ text }] }
    ];

    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${session.access_token}`
      },
      body: JSON.stringify({ history: nextHistory })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Unable to generate a reply.");
    }
    if (!data.reply) throw new Error("No reply received.");

    addMessage(data.reply, "bot");
    history = [
      ...nextHistory,
      { role: "assistant", parts: [{ text: data.reply }] }
    ].slice(-20);

    notice.textContent = "AI assistant · Replies may need verification.";
  } catch (error) {
    addMessage("Sorry, I can't respond right now. Please try again later.", "bot");
    notice.textContent = error.message;
  } finally {
    sendButton.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
