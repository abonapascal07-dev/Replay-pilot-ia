
<div id="fb-root"></div>
<script>
const META_APP_ID = "1483751340345736";
const META_CONFIG_ID = "1498676108792714";

let metaSdkReady = false;
let activeSignup = null;

window.fbAsyncInit = function () {
  FB.init({
    appId: META_APP_ID,
    autoLogAppEvents: true,
    xfbml: false,
    version: "v21.0"
  });
  metaSdkReady = true;
};

(function (d, s, id) {
  if (d.getElementById(id)) return;
  const js = d.createElement(s);
  js.id = id;
  js.src = "https://connect.facebook.net/en_US/sdk.js";
  js.async = true;
  js.defer = true;
  d.getElementsByTagName(s)[0].parentNode.insertBefore(js, d.getElementsByTagName(s)[0]);
})(document, "script", "facebook-jssdk");

function completeWhatsAppSignup() {
  if (!activeSignup || activeSignup.done) return;

  const signup = activeSignup;
  if (!signup.code || !signup.wabaId || !signup.phoneNumberId) return;

  signup.done = true;
  clearTimeout(signup.timer);

  const status = document.getElementById("waStatus");
  status.textContent = "Enregistrement sécurisé de votre compte WhatsApp...";

  (async function () {
    try {
      const { data: { session }, error } =
        await supabaseClient.auth.getSession();

      if (error || !session) {
        throw new Error("Veuillez vous reconnecter à votre compte ReplyPilot.");
      }

      const response = await fetch("/api/whatsapp/connect", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + session.access_token
        },
        body: JSON.stringify({
          code: signup.code,
          waba_id: signup.wabaId,
          phone_number_id: signup.phoneNumberId
        })
      });

      const result = await response.json();

      if (!response.ok) {
        throw new Error(result.error || "La connexion WhatsApp a échoué.");
      }

      status.textContent =
        "WhatsApp connecté : " +
        (result.connection?.phone_number || "Compte connecté");

    } catch (error) {
      console.error("WhatsApp connection error:", error);
      status.textContent = "Erreur : " + error.message;
    } finally {
      if (activeSignup === signup) activeSignup = null;
    }
  })();
}

window.addEventListener("message", function (event) {
  let hostname;

  try {
    hostname = new URL(event.origin).hostname;
  } catch {
    return;
  }

  if (hostname !== "facebook.com" && !hostname.endsWith(".facebook.com")) {
    return;
  }

  let data;

  try {
    data = typeof event.data === "string"
      ? JSON.parse(event.data)
      : event.data;
  } catch {
    return;
  }

  if (!data || data.type !== "WA_EMBEDDED_SIGNUP") return;
  if (!activeSignup) return;

  const payload = data.data || data;

  activeSignup.wabaId =
    payload.waba_id || payload.wabaId || null;

  activeSignup.phoneNumberId =
    payload.phone_number_id || payload.phoneNumberId || null;

  completeWhatsAppSignup();
});

document.getElementById("waBtn").addEventListener("click", function () {
  const status = document.getElementById("waStatus");

  if (!metaSdkReady || !window.FB) {
    status.textContent =
      "Meta est encore en chargement. Réessayez dans quelques secondes.";
    return;
  }

  if (activeSignup) {
    status.textContent = "Une connexion WhatsApp est déjà en cours.";
    return;
  }

  activeSignup = {
    code: null,
    wabaId: null,
    phoneNumberId: null,
    done: false,
    timer: null
  };

  const signup = activeSignup;

  status.textContent = "Ouverture de la connexion Meta...";

  signup.timer = setTimeout(function () {
    if (activeSignup !== signup) return;

    activeSignup = null;
    status.textContent =
      "Délai dépassé. Réessayez la connexion WhatsApp.";
  }, 120000);

  FB.login(function (response) {
    if (activeSignup !== signup) return;

    if (response && response.authResponse && response.authResponse.code) {
      signup.code = response.authResponse.code;
      status.textContent =
        "Autorisation reçue. Finalisation de la connexion...";
      completeWhatsAppSignup();
    } else {
      clearTimeout(signup.timer);
      activeSignup = null;
      status.textContent =
        "Connexion Meta annulée ou code d'autorisation absent.";
    }
  }, {
    config_id: META_CONFIG_ID,
    response_type: "code",
    override_default_response_type: true,
    extras: {
      setup: {},
      sessionInfoVersion: "3"
    }
  });
});
</script>
