<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReplyPilot AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1120;color:#f8fafc;font-family:Arial,sans-serif;padding:24px 16px}
.container{max-width:650px;margin:35px auto}
.logo{color:#60a5fa;font-weight:bold;font-size:18px}
h1{font-size:34px;margin:25px 0 10px}
p{color:#94a3b8;line-height:1.6}
.panel{background:#151f32;border:1px solid #29364d;border-radius:16px;padding:20px;margin-top:25px}
label{display:block;margin:18px 0 8px;font-weight:bold}
textarea,select{width:100%;padding:14px;border-radius:9px;border:1px solid #334155;background:#0b1120;color:white;font-size:15px}
textarea{height:140px;resize:vertical}
button{width:100%;margin-top:20px;padding:15px;background:#2563eb;color:white;border:0;border-radius:9px;font-size:16px;font-weight:bold}
button:active{opacity:.8}
#result{white-space:pre-wrap;color:#dbeafe;line-height:1.6}
footer{text-align:center;color:#64748b;font-size:12px;margin-top:30px}
</style>
</head>
<body>
<div class="container">
<div class="logo">✦ ReplyPilot AI</div>
<h1>Reply to customers smarter.</h1>
<p>Your customer communication assistant. Create clear, professional replies in seconds.</p>

<div class="panel">
<label for="message">Customer message</label>
<textarea id="message" placeholder="Paste your customer's message here..."></textarea>

<label for="tone">Choose your reply tone</label>
<select id="tone">
<option>Professional</option>
<option>Friendly</option>
<option>Formal</option>
</select>

<button onclick="generateReply()">Generate Reply</button>

<div id="output" hidden>
<label>Your suggested reply</label>
<p id="result"></p>
<button onclick="copyReply()">Copy Reply</button>
</div>
<p id="status" aria-live="polite"></p>
</div>
<footer>ReplyPilot AI © 2026</footer>
</div>

<script>
function generateReply(){
const message=document.getElementById("message").value.trim();
const tone=document.getElementById("tone").value;
const status=document.getElementById("status");
if(!message){
status.textContent="Please paste a customer message first.";
return;
}
let opening="Hello! Thank you for contacting us.";
if(tone==="Friendly") opening="Hi there! Thanks for reaching out.";
if(tone==="Formal") opening="Dear Customer, thank you for your message.";
const reply=opening+" We have received your inquiry and would be happy to help. Could you please share a little more information so we can assist you better? We look forward to hearing from you.";
document.getElementById("result").textContent=reply;
document.getElementById("output").hidden=false;
status.textContent="Demo suggestion created. AI connection is coming next.";
}
function copyReply(){
const reply=document.getElementById("result").textContent;
if(navigator.clipboard){
navigator.clipboard.writeText(reply);
document.getElementById("status").textContent="Reply copied!";
}else{
document.getElementById("status").textContent="Please select and copy the reply.";
}
}
</script>
</body>
</html>
