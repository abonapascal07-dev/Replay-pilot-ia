    }
    #app-box > button { width: 100%; }
    #reply-box {
      margin-top: 16px;

<body>
  <h1>ReplyPilot AI</h1>
  <p>Your AI-powered customer response assistant.</p>
  <button id="start-btn" onclick="openApp()">Get Started</button>

  <div id="app-box">
    <label for="customer-msg"><strong>Message du client :</strong></label><br><br>
    <textarea id="customer-msg" placeholder="Collez ici le message du client..."></textarea>
    <button onclick="generateReply()">Générer une réponse IA</button>
    <div id="reply-box">La réponse générée apparaîtra ici...</div>
  </div>

  <script>
    function openApp() {
      document.getElementById('start-btn').style.display = 'none';
      document.getElementById('app-box').style.display = 'block';
    }

    let history = [];

    async function generateReply() {
      const msg = document.getElementById('customer-msg').value.trim();
      const replyBox = document.getElementById('reply-box');

      if (!msg) {
        replyBox.textContent = "Veuillez entrer un message d'abord.";
        return;
      }

      replyBox.textContent = "Génération de la réponse en cours...";
      history.push({ role: "user", parts: [{ text: msg }] });

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ history })
        });
        const data = await res.json();

        if (data.reply) {
          history.push({ role: "model", parts: [{ text: data.reply }] });
          replyBox.textContent = data.reply;
        } else {
          history.pop();
          replyBox.textContent = data.error || "Erreur inconnue.";
        }
      } catch (e) {
        history.pop();
        replyBox.textContent = "Erreur de connexion au serveur.";
      }
    }
  </script>
</body>
</html>
